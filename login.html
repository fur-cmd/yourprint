<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — YourPrint</title>
<meta name="description" content="Login ke YourPrint — Akses akun pelanggan Anda.">
<link rel="icon" type="image/png" href="images/logo/logo.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ==================== RESET & BASE ==================== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #16233F;
    --ink-light: #24365C;
    --paper: #F3F5F7;
    --stamp: #E4572E;
    --stamp-dark: #C6431E;
    --highlight: #FFC53D;
    --line: #D8DEE4;
    --slate: #5B6B7F;
    --success: #22C55E;
    --error: #EF4444;
  }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ==================== ANIMATED BACKGROUND ==================== */
  .login-bg {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 25%, #16233F 50%, #1a1a3e 75%, #0f172a 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    z-index: 0;
  }

  .login-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(228,87,46,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(255,197,61,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(100,120,220,0.1) 0%, transparent 50%);
    animation: pulseGlow 8s ease-in-out infinite alternate;
  }

  .login-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(circle at 25% 35%, rgba(255,255,255,0.03) 1px, transparent 1px),
      radial-gradient(circle at 75% 65%, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes pulseGlow {
    0% { opacity: 0.7; }
    100% { opacity: 1; }
  }

  /* Floating shapes */
  .floating-shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.04;
    background: white;
    animation: floatShape 20s ease-in-out infinite;
  }
  .floating-shape:nth-child(1) { width: 300px; height: 300px; top: -50px; left: -50px; animation-delay: 0s; }
  .floating-shape:nth-child(2) { width: 200px; height: 200px; bottom: -40px; right: -40px; animation-delay: -5s; }
  .floating-shape:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 70%; animation-delay: -10s; }

  @keyframes floatShape {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    33% { transform: translateY(-30px) rotate(120deg) scale(1.1); }
    66% { transform: translateY(15px) rotate(240deg) scale(0.95); }
  }

  /* ==================== LOGIN CARD ==================== */
  .login-container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: 1.25rem;
    animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .login-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 1.5rem;
    padding: 2.5rem 2rem;
    box-shadow: 
      0 25px 50px -12px rgba(0, 0, 0, 0.4),
      0 0 0 1px rgba(255,255,255,0.1) inset;
  }

  /* Logo */
  .login-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 2rem;
  }

  .login-logo .logo-icon {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    transform: rotate(-3deg);
    transition: transform 0.3s ease;
  }
  .login-logo:hover .logo-icon { transform: rotate(0deg); }

  .login-logo .logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--ink);
  }
  .login-logo .logo-text span { color: var(--stamp); }

  /* Form */
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .form-group {
    position: relative;
  }

  .form-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.4rem;
  }

  .form-group input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid var(--line);
    border-radius: 0.75rem;
    font-size: 0.9rem;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-group input:focus {
    outline: none;
    border-color: var(--stamp);
    box-shadow: 0 0 0 3px rgba(228, 87, 46, 0.15);
  }

  .form-group input::placeholder {
    color: #a0aec0;
  }

  /* Password toggle */
  .password-wrapper {
    position: relative;
  }

  .password-wrapper input {
    padding-right: 3rem;
  }

  .toggle-password {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--slate);
    padding: 0.25rem;
    display: flex;
    align-items: center;
    transition: color 0.2s;
  }
  .toggle-password:hover { color: var(--ink); }

  .toggle-password svg { width: 20px; height: 20px; }

  /* Submit button */
  .login-submit {
    width: 100%;
    padding: 0.85rem;
    border: none;
    border-radius: 0.75rem;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
    background: linear-gradient(135deg, var(--ink), var(--ink-light));
    color: #fff;
    box-shadow: 0 4px 14px rgba(22, 35, 63, 0.3);
  }
  .login-submit:hover {
    box-shadow: 0 6px 20px rgba(22, 35, 63, 0.4);
    transform: translateY(-1px);
  }
  .login-submit:active { transform: translateY(0); }

  .login-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none !important;
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Divider */
  .form-divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 0.25rem 0;
  }
  .form-divider::before, .form-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .form-divider span {
    font-size: 0.7rem;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
  }

  /* Error message */
  .error-msg {
    display: none;
    align-items: center;
    gap: 0.5rem;
    background: #FEF2F2;
    border: 1px solid #FECACA;
    color: #DC2626;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.65rem 1rem;
    border-radius: 0.6rem;
    animation: shakeError 0.4s ease;
  }
  .error-msg.show { display: flex; }

  @keyframes shakeError {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* Success message */
  .success-msg {
    display: none;
    align-items: center;
    gap: 0.5rem;
    background: #F0FDF4;
    border: 1px solid #BBF7D0;
    color: #16A34A;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.65rem 1rem;
    border-radius: 0.6rem;
  }
  .success-msg.show { display: flex; }

  /* Footer text */
  .login-footer {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.4);
  }
  .login-footer a {
    color: rgba(255, 255, 255, 0.65);
    text-decoration: none;
    font-weight: 500;
  }
  .login-footer a:hover {
    color: var(--stamp);
    text-decoration: underline;
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff;
    padding: 0.75rem 1.5rem;
    border-radius: 9999px;
    font-size: 0.875rem;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 9999;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Responsive */
  @media (max-width: 480px) {
    .login-card { padding: 2rem 1.5rem; border-radius: 1.25rem; }
    .login-logo .logo-text { font-size: 1.25rem; }
  }
</style>
</head>
<body>

  <!-- Animated Background -->
  <div class="login-bg">
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
  </div>

  <!-- Login Card -->
  <div class="login-container">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon">Y</div>
        <div class="logo-text">Your<span>Print</span></div>
      </div>

      <!-- Error / Success Messages -->
      <div class="error-msg" id="errorMsg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>
        <span id="errorText">Username atau password salah</span>
      </div>

      <div class="success-msg" id="successMsg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        <span id="successText">Login berhasil! Mengalihkan...</span>
      </div>

      <!-- ===== USER LOGIN FORM ===== -->
      <form class="login-form" id="form-user" data-mode="login">
        <div class="form-group" id="user-name-group" style="display: none;">
          <label for="user-name">Nama Lengkap</label>
          <input type="text" id="user-name" placeholder="Nama Anda">
        </div>

        <div class="form-group">
          <label for="user-phone">No. WhatsApp</label>
          <input type="tel" id="user-phone" placeholder="contoh: 08xxxxxxxxxx" required>
        </div>
        
        <div class="form-group">
          <label for="user-password">Password / PIN</label>
          <div class="password-wrapper">
            <input type="password" id="user-password" placeholder="Buat / masukkan password" required>
            <button type="button" class="toggle-password" data-target="user-password" aria-label="Toggle password visibility">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-submit" id="user-submit-btn">
          <span class="btn-text">Masuk</span>
        </button>

        <div class="form-divider"><span>Atau</span></div>
        <p style="font-size: 0.8rem; color: var(--slate); text-align: center;">
          <span id="user-toggle-text">Belum punya akun?</span> 
          <a href="#" id="user-toggle-btn" style="color: var(--stamp); font-weight: 600; text-decoration: none;">Daftar di sini</a>
        </p>
      </form>

    </div>

    <!-- Footer -->
    <p class="login-footer">
      &copy; 2026 YourPrint &mdash; <a href="admin-login.html">Login Admin</a> &middot; <a href="index.html">Kembali ke Website</a>
    </p>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
